<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Shadow System">
  <!-- Emblema original do Shadow System: losango duplo com núcleo e anel de runas. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" fill="none" stroke="url(#g)">
    <circle cx="32" cy="32" r="27" stroke-width="1" stroke-dasharray="3 4" opacity=".7"/>
    <path d="M32 6 58 32 32 58 6 32Z" stroke-width="2.4"/>
    <path d="M32 15 49 32 32 49 15 32Z" stroke-width="1.4" opacity=".8"/>
  </g>
  <path d="M32 23 41 32 32 41 23 32Z" fill="url(#g)" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="2.6" fill="#e6e4f2"/>
</svg>
