{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block heading %}Acesso{% endblock %}
{% block content %}
<div class="access-page {% if media_versions.login %}with-art{% endif %}">
  {% if media_versions.login %}
    <div class="access-art" role="img" aria-label="Arte do System" style="background-image: url('{{ url_for('core.media_file', slot='login', v=media_versions.login) }}')"></div>
  {% endif %}
  <section class="panel system-window">
    <div class="gate" aria-hidden="true"></div>
    <p class="system-label">[SYSTEM] Identifique-se, Hunter.</p>
    <form method="post" class="form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label class="label" for="username">Usuário ou e-mail</label>
        <input class="input" id="username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label class="label" for="password">Senha</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Entrar</button>
    </form>
  </section>
</div>
{% endblock %}
