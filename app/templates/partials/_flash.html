{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="flash-stack">
      {% for category, message in messages %}
        <div class="flash flash-{{ category if category != 'message' else 'info' }}" role="status">
          <span class="flash-tag">[SYSTEM]</span> {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
