<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sem conexão · Shadow System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/shadow.css') }}">
</head>
<body data-experience="gate">
  <main class="content">
    <section class="panel system-window narrow" style="margin-top: 15vh; text-align: center">
      <div class="gate" aria-hidden="true"></div>
      <p class="system-label">[SYSTEM] Conexão perdida</p>
      <p>O System precisa de internet para carregar seus dados. Assim que a conexão voltar, toque em tentar de novo.</p>
      <a class="btn btn-primary" href="/">Tentar de novo</a>
    </section>
  </main>
</body>
</html>
